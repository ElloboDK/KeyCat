name: CLA

# Asks first-time contributors to sign CLA.md by replying to the pull request, and records the
# signatures on the cla-signatures branch. pull_request_target, because a pull request from a
# fork gets no token that can comment or set a status otherwise; it is safe here only because
# nothing from the pull request is checked out or run. Only ElloboDK/KeyCat takes outside pull
# requests; the Pro repo merges this file and skips it.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.repository == 'ElloboDK/KeyCat' && (github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/ElloboDK/KeyCat/blob/main/CLA.md
          branch: cla-signatures
          allowlist: ElloboDK,dependabot[bot],github-actions[bot]
